<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="mask-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Transparent base with segmented binary mask polygons -->
  <path d="M 240 180 C 300 170 380 190 440 220 C 500 250 560 270 580 340 C 590 390 530 430 460 410 C 390 390 330 360 280 330 C 230 300 200 260 210 210 Z"
        fill="#F59E0B" fill-opacity="0.35" stroke="#F59E0B" stroke-width="2.5"/>
  <path d="M 240 180 C 300 170 380 190 440 220 C 500 250 560 270 580 340 C 590 390 530 430 460 410 C 390 390 330 360 280 330 C 230 300 200 260 210 210 Z"
        fill="url(#mask-hatch)"/>

  <!-- Secondary Clusters -->
  <ellipse cx="560" cy="370" rx="55" ry="35" fill="#F59E0B" fill-opacity="0.35" stroke="#F59E0B" stroke-width="2"/>
  <ellipse cx="560" cy="370" rx="55" ry="35" fill="url(#mask-hatch)"/>
  
  <ellipse cx="220" cy="220" rx="35" ry="25" fill="#F59E0B" fill-opacity="0.35" stroke="#F59E0B" stroke-width="2"/>

  <!-- Overlay Watermark -->
  <rect x="430" y="16" width="350" height="24" fill="#090D14" opacity="0.85" rx="2" stroke="#1E2838" stroke-width="0.8"/>
  <text x="440" y="32" fill="#FCA5A5" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">
    SYNTHETIC VISUAL FIXTURE // NOT NISAR IMAGERY
  </text>

  <rect x="20" y="458" width="300" height="24" fill="#090D14" opacity="0.85" rx="2" stroke="#1E2838" stroke-width="0.8"/>
  <text x="28" y="474" fill="#F59E0B" font-family="monospace" font-size="10" font-weight="bold">
    DETECTED CHANGE MASK &bull; AREA: 4.80 km&sup2;
  </text>
</svg>
