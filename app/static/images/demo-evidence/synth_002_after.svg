  </defs>

  <rect width="800" height="500" fill="#0A0E16"/>
  <rect width="800" height="500" fill="url(#forest-grad-002b)"/>
  <rect width="800" height="500" fill="url(#canopy-pattern-002b)"/>

  <!-- Topographic Drainage Rills -->
  <path d="M 0 180 Q 250 140 450 190 T 800 160" stroke="#101924" stroke-width="6" fill="none"/>
  <path d="M 100 0 Q 300 250 400 500" stroke="#101924" stroke-width="8" fill="none"/>

  <!-- DISTURBED / DECORRELATED CANOPY PATCH (Reduced backscatter & loss of texture) -->
  <path d="M 330 180 C 420 160 520 190 560 250 C 580 310 540 370 470 390 C 390 410 320 370 290 320 C 270 270 290 200 330 180 Z"
        fill="url(#disturbed-patch)" stroke="#222C3D" stroke-width="2"/>

  <!-- Reticle -->
  <g stroke="#1E6BFF" stroke-width="1" opacity="0.6">
    <circle cx="400" cy="250" r="4" fill="none"/>
    <line x1="390" y1="250" x2="410" y2="250"/>
    <line x1="400" y1="240" x2="400" y2="260"/>
  </g>

  <rect x="430" y="16" width="350" height="24" fill="#090D14" opacity="0.85" rx="2" stroke="#1E2838" stroke-width="0.8"/>
  <text x="440" y="32" fill="#FCA5A5" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">
