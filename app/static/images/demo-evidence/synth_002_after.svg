<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="canopy-pattern-002b" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.5" fill="#2E3C4E" opacity="0.6"/>
      <circle cx="15" cy="15" r="3" fill="#3D4F66" opacity="0.7"/>
      <circle cx="15" cy="5" r="1.5" fill="#1C2735" opacity="0.5"/>
    </pattern>
    <radialGradient id="forest-grad-002b" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E2B3C"/>
      <stop offset="60%" stop-color="#121B26"/>
      <stop offset="100%" stop-color="#080E16"/>
    </radialGradient>
    <radialGradient id="disturbed-patch" cx="48%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#0E131C"/>
      <stop offset="70%" stop-color="#141B26"/>
      <stop offset="100%" stop-color="#1E2B3C"/>
