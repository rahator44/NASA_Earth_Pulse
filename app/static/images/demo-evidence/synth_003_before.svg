  <path d="M 60 200 Q 180 170 280 230" stroke="#475A77" stroke-width="2" fill="none"/>
  <path d="M 60 320 Q 160 300 280 340" stroke="#475A77" stroke-width="2" fill="none"/>

  <!-- Missing Data Void / Quality Degradation Zone -->
  <rect x="290" y="40" width="460" height="420" fill="#05080E" stroke="#1E2838" stroke-width="1"/>
  <rect x="290" y="40" width="460" height="420" fill="url(#missing-data-stripes)"/>

  <text x="520" y="240" fill="#F87171" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">
