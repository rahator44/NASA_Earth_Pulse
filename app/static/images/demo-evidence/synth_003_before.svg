  <rect x="20" y="458" width="310" height="24" fill="#090D14" opacity="0.85" rx="2" stroke="#1E2838" stroke-width="0.8"/>
  <text x="28" y="474" fill="#FCA5A5" font-family="monospace" font-size="10" font-weight="bold">
