<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid-pattern-001" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#182334" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="terrain-grad-001" cx="45%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#222F42"/>
      <stop offset="50%" stop-color="#141E2C"/>
      <stop offset="100%" stop-color="#0A101A"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="#080D16"/>
  <rect width="800" height="500" fill="url(#terrain-grad-001)" opacity="0.8"/>
  <rect width="800" height="500" fill="url(#grid-pattern-001)"/>

  <!-- Radar Terrain Contours (Simulated Ground Backscatter) -->
  <g opacity="0.45" stroke="#33445C" stroke-width="1.2" fill="none">
    <path d="M 50 120 Q 200 80 400 130 T 750 90"/>
    <path d="M 40 220 Q 220 180 380 240 T 760 210"/>
    <path d="M 60 340 Q 250 310 450 360 T 740 330"/>
    <path d="M 30 440 Q 220 400 480 430 T 770 410"/>
  </g>

  <!-- Baseline River Corridor (Normal Channel Before Inundation) -->
  <path d="M 120 0 C 150 120 180 180 260 230 C 340 280 430 250 510 320 C 580 380 620 420 660 500"
        fill="none" stroke="#040810" stroke-width="22" stroke-linecap="round"/>
  <path d="M 120 0 C 150 120 180 180 260 230 C 340 280 430 250 510 320 C 580 380 620 420 660 500"
        fill="none" stroke="#0D1A2D" stroke-width="12" stroke-linecap="round"/>

  <!-- Wetland Patches (Dry / Moderate Backscatter Season) -->
  <ellipse cx="320" cy="270" rx="45" ry="30" fill="#1C283A" opacity="0.6"/>
  <ellipse cx="440" cy="300" rx="60" ry="35" fill="#1C283A" opacity="0.5"/>
  <ellipse cx="530" cy="360" rx="40" ry="25" fill="#1C283A" opacity="0.5"/>

  <!-- Technical Reticle & Range/Azimuth Grid Marks -->
  <g stroke="#1E6BFF" stroke-width="1" opacity="0.6">
    <line x1="20" y1="20" x2="40" y2="20"/>
    <line x1="20" y1="20" x2="20" y2="40"/>
    <line x1="780" y1="20" x2="760" y2="20"/>
    <line x1="780" y1="20" x2="780" y2="40"/>
    <line x1="20" y1="480" x2="40" y2="480"/>
    <line x1="20" y1="480" x2="20" y2="460"/>
    <line x1="780" y1="480" x2="760" y2="480"/>
    <line x1="780" y1="480" x2="780" y2="460"/>
    <circle cx="400" cy="250" r="4" fill="none"/>
    <line x1="390" y1="250" x2="410" y2="250"/>
    <line x1="400" y1="240" x2="400" y2="260"/>
  </g>

  <!-- Prominent Watermarks & Disclaimer -->
  <rect x="430" y="16" width="350" height="24" fill="#090D14" opacity="0.85" rx="2" stroke="#1E2838" stroke-width="0.8"/>
  <text x="440" y="32" fill="#FCA5A5" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">
    SYNTHETIC VISUAL FIXTURE // NOT NISAR IMAGERY
  </text>

  <rect x="20" y="458" width="280" height="24" fill="#090D14" opacity="0.85" rx="2" stroke="#1E2838" stroke-width="0.8"/>
  <text x="28" y="474" fill="#60A5FA" font-family="monospace" font-size="10" font-weight="bold">
    BEFORE OBSERVATION &bull; 01 AUG 2026 &bull; BASELINE
  </text>
</svg>
