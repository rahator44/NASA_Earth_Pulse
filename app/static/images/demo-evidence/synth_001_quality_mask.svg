<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Valid Pixel Swath (Green/Cyan tint indicating passed quality gate) -->
  <rect x="30" y="20" width="740" height="460" rx="4" fill="#10B981" fill-opacity="0.25" stroke="#10B981" stroke-width="2"/>
  
  <!-- Subtle invalid border strip (6% invalid pixels) -->
  <path d="M 30 20 L 770 20 L 770 40 L 30 40 Z" fill="#EF4444" fill-opacity="0.3"/>
  <path d="M 30 460 L 770 460 L 770 480 L 30 480 Z" fill="#EF4444" fill-opacity="0.3"/>

  <!-- Watermark & Label -->
  <rect x="430" y="24" width="330" height="22" fill="#090D14" opacity="0.85" rx="2" stroke="#1E2838" stroke-width="0.8"/>
  <text x="440" y="38" fill="#FCA5A5" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1">
    SYNTHETIC VISUAL // QUALITY MASK
  </text>

  <rect x="38" y="445" width="310" height="24" fill="#090D14" opacity="0.85" rx="2" stroke="#1E2838" stroke-width="0.8"/>
  <text x="46" y="461" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold">
    VALID RADAR SWATH &bull; 94.0% VALID PIXELS (PASSED)
  </text>
</svg>
