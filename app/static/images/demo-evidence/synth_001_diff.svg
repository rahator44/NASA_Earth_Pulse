<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid-pattern-diff1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#182334" stroke-width="0.8" opacity="0.4"/>
    </pattern>
    <radialGradient id="diff-hotspot-001" cx="45%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#1E3A8A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0B1322" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Neutral Difference Background Canvas -->
  <rect width="800" height="500" fill="#0A0F1A"/>
  <rect width="800" height="500" fill="url(#grid-pattern-diff1)"/>

  <!-- Backscatter Reduction Plume (Delta dB Drop Zone) -->
  <path d="M 240 180 C 300 170 380 190 440 220 C 500 250 560 270 580 340 C 590 390 530 430 460 410 C 390 390 330 360 280 330 C 230 300 200 260 210 210 Z"
        fill="url(#diff-hotspot-001)" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Secondary Difference Patches -->
  <ellipse cx="560" cy="370" rx="55" ry="35" fill="#3B82F6" opacity="0.65"/>
  <ellipse cx="220" cy="220" rx="35" ry="25" fill="#3B82F6" opacity="0.65"/>

  <!-- Reticle -->
  <g stroke="#1E6BFF" stroke-width="1" opacity="0.5">
    <circle cx="400" cy="250" r="4" fill="none"/>
    <line x1="390" y1="250" x2="410" y2="250"/>
    <line x1="400" y1="240" x2="400" y2="260"/>
  </g>

  <!-- Watermark & Legend -->
  <rect x="430" y="16" width="350" height="24" fill="#090D14" opacity="0.85" rx="2" stroke="#1E2838" stroke-width="0.8"/>
  <text x="440" y="32" fill="#FCA5A5" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">
    SYNTHETIC VISUAL FIXTURE // NOT NISAR IMAGERY
  </text>

  <rect x="20" y="458" width="310" height="24" fill="#090D14" opacity="0.85" rx="2" stroke="#1E2838" stroke-width="0.8"/>
  <text x="28" y="474" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold">
    BACKSCATTER DIFFERENCE &bull; &Delta;&gamma;&deg; DROP: -3.8 dB
  </text>
</svg>
