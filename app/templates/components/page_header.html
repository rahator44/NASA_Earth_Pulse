<div class="mb-8 border-b border-[#1E2838] pb-6">
  <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
    <div>
      <!-- Section Label with square blue dot -->
      <div class="section-label mb-2">
        <span class="section-label-dot"></span>
        <span>{{ page_label | default('NISAR SURFACE CHANGE EXPLORER') }}</span>
      </div>
      <!-- Large Editorial / Scientific Heading -->
      <h1 class="type-page-title">
        {{ page_title }}
      </h1>
      <!-- Explanatory Mission Sentence -->
      {% if page_description %}
      <p class="type-body-large text-[#94A3B8] mt-2 max-w-3xl">
        {{ page_description }}
      </p>
      {% endif %}
    </div>

    <!-- Optional Header Action / Meta Badge -->
    <div class="flex items-center gap-3">
      {% if badge_text %}
      <span class="badge badge-validated">
        <span class="w-1.5 h-1.5 bg-[#1E6BFF] inline-block"></span>
        {{ badge_text }}
      </span>
      {% endif %}
      {% if header_action %}
      {{ header_action | safe }}
      {% endif %}
    </div>
  </div>
</div>
